services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongo:27017/yiri
      JWT_SECRET: change-me
      CORS_ORIGIN: "*"
      # Optional Twilio
      TWILIO_ACCOUNT_SID: ""
      TWILIO_AUTH_TOKEN: ""
      TWILIO_FROM_NUMBER: ""
    ports:
      - "3001:3001"
    depends_on:
      - mongo

volumes:
  mongo_data:
